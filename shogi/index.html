<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>デッキ対戦ループ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f7f8ff 0%, #edf2ff 100%);
      }

      .panel {
        width: min(560px, calc(100% - 2rem));
        background: #fff;
        color: #1f2937;
        border-radius: 16px;
        padding: 1.5rem;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin-top: 0;
        font-size: 1.4rem;
      }

      .hidden {
        display: none;
      }

      .options {
        display: grid;
        gap: 0.75rem;
      }

      .option {
        border: 1px solid #dbe2ff;
        border-radius: 12px;
        padding: 1rem;
        text-align: left;
        background: #f8faff;
        cursor: pointer;
      }

      .option:hover {
        border-color: #8fa6ff;
        background: #eef2ff;
      }

      .option-title {
        font-weight: 700;
        margin: 0 0 0.25rem;
      }

      .option-desc {
        margin: 0;
        font-size: 0.9rem;
        color: #4b5563;
      }

      #status {
        margin-top: 1rem;
        font-weight: 600;
        color: #1d4ed8;
      }

      .flow-note {
        margin: 0.25rem 0 0;
        font-size: 0.9rem;
        color: #4b5563;
      }

      .battle-card {
        margin-top: 1rem;
        padding: 1rem;
        border-radius: 12px;
        background: #f8faff;
        border: 1px solid #dbe2ff;
      }

      .battle-result {
        margin: 0;
        font-size: 1rem;
      }

      .actions {
        margin-top: 1rem;
        display: flex;
        gap: 0.75rem;
      }

      .actions .option {
        flex: 1;
      }

      .battle-state {
        margin-top: 0.75rem;
        padding: 0.75rem;
        border-radius: 10px;
        background: #ffffff;
        border: 1px solid #dbe2ff;
        font-size: 0.95rem;
      }

      .battle-state p {
        margin: 0.2rem 0;
      }

      .battle-log {
        margin-top: 0.75rem;
        max-height: 160px;
        overflow-y: auto;
        padding: 0.75rem;
        border-radius: 10px;
        border: 1px solid #dbe2ff;
        background: #ffffff;
      }

      .battle-log p {
        margin: 0 0 0.35rem;
        font-size: 0.9rem;
      }

      .hand-cards {
        margin-top: 1rem;
        display: grid;
        gap: 0.6rem;
      }

      .hand-card-button {
        border: 1px solid #dbe2ff;
        border-radius: 10px;
        padding: 0.75rem;
        background: #ffffff;
        text-align: left;
        cursor: pointer;
      }

      .hand-card-button:hover {
        border-color: #8fa6ff;
        background: #eef2ff;
      }

      .hand-card-title {
        margin: 0;
        font-weight: 700;
      }

      .hand-card-effect {
        margin: 0.2rem 0 0;
        font-size: 0.9rem;
        color: #4b5563;
      }

      .empty-hand {
        margin: 0;
        font-size: 0.9rem;
        color: #6b7280;
      }

      .card-back {
        background: repeating-linear-gradient(
          -45deg,
          #243b53,
          #243b53 8px,
          #334e68 8px,
          #334e68 16px
        );
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <section id="deck-select-view">
        <h1>最初に使うデッキを選んでください</h1>
        <div class="options">
          <button class="option" data-mode="standard">
            <p class="option-title">スタンダードデッキを使う</p>
            <p class="option-desc">すぐにプレイできる標準構成を選択します。</p>
          </button>

          <button class="option" data-mode="create">
            <p class="option-title">デッキを作成する</p>
            <p class="option-desc">カードを選びながら自分用にデッキを作成します。</p>
          </button>
        </div>
      </section>

      <section id="battle-play-view" class="hidden">
        <h1 class="mb-2">対戦中</h1>
        <p class="flow-note">画面下の手札からカードを選び、行動してください。</p>
        <div class="mt-3 h-[78dvh] overflow-hidden rounded-2xl border border-indigo-100 bg-indigo-50/50 p-2 md:p-3">
          <div class="grid h-full grid-rows-[auto_auto_1fr_auto_1fr_1.4fr_auto] gap-2">
            <section id="opponent-leader-info" class="rounded-xl bg-white/90 p-2 shadow-sm"></section>
            <section id="opponent-hand-area" class="rounded-xl bg-white/85 p-2 shadow-sm"></section>
            <section id="opponent-board-area" class="rounded-xl bg-white/85 p-2 shadow-sm"></section>
            <section id="center-battle-info" class="rounded-xl border border-indigo-200 bg-indigo-100/70 p-2"></section>
            <section id="player-board-area" class="rounded-xl bg-white/95 p-2 shadow-sm"></section>
            <section id="player-hand-area" class="rounded-xl bg-white p-2 shadow-sm"></section>
            <section id="battle-controls-area" class="rounded-xl bg-white/95 p-2 shadow-sm"></section>
          </div>
        </div>
      </section>

      <section id="battle-start-view" class="hidden">
        <h1>対戦開始</h1>
        <p id="battle-start-message"></p>
        <p class="flow-note">準備ができたら、下のボタンで対戦を開始してください。</p>
        <button class="option" id="begin-battle-button">
          <p class="option-title">このデッキで対戦開始</p>
          <p class="option-desc">マッチングして対戦に入ります。</p>
        </button>
      </section>

      <section id="battle-view" class="hidden">
        <h1>対戦終了</h1>
        <div class="battle-card">
          <p class="battle-result" id="battle-result"></p>
          <div class="actions">
            <button class="option" id="edit-deck-button">
              <p class="option-title">デッキを作成する</p>
              <p class="option-desc">デッキを調整して次の対戦に挑みます。</p>
            </button>
            <button class="option" id="rematch-button">
              <p class="option-title">そのまま再戦</p>
              <p class="option-desc">同じデッキで続けてもう1戦します。</p>
            </button>
          </div>
        </div>
      </section>

      <section id="deck-builder-view" class="hidden">
        <h1>デッキ作成</h1>
        <p>カードを調整しました。次の対戦に進みますか？</p>
        <button class="option" id="start-after-build">
          <p class="option-title">このデッキで対戦する</p>
          <p class="option-desc">作成したデッキで対戦に戻ります。</p>
        </button>
      </section>

      <section>
        <p id="status" aria-live="polite"></p>
      </section>
    </main>

    <script>
      const deckSelectView = document.getElementById('deck-select-view');
      const battlePlayView = document.getElementById('battle-play-view');
      const battleStartView = document.getElementById('battle-start-view');
      const battleView = document.getElementById('battle-view');
      const deckBuilderView = document.getElementById('deck-builder-view');
      const battleStartMessage = document.getElementById('battle-start-message');
      const battleResult = document.getElementById('battle-result');
      const status = document.getElementById('status');
      const opponentLeaderInfo = document.getElementById('opponent-leader-info');
      const opponentHandArea = document.getElementById('opponent-hand-area');
      const opponentBoardArea = document.getElementById('opponent-board-area');
      const centerBattleInfo = document.getElementById('center-battle-info');
      const playerBoardArea = document.getElementById('player-board-area');
      const playerHandArea = document.getElementById('player-hand-area');
      const battleControlsArea = document.getElementById('battle-controls-area');

      let deckName = 'スタンダードデッキ';
      let battleCount = 0;
      let battleState = null;

      const STANDARD_CARD_POOL = [
        { name: 'ファイアボール', damage: 3 },
        { name: 'アイスランス', damage: 2 },
        { name: 'サンダーストライク', damage: 4 },
        { name: 'シールド', damage: 0, heal: 2 },
        { name: 'スラッシュ', damage: 2 },
        { name: 'ヒールライト', damage: 0, heal: 3 },
        { name: 'アローショット', damage: 1 },
        { name: 'ブレイズ', damage: 3 },
      ];

      const CREATE_CARD_POOL = [
        { name: 'ダブルスラッシュ', damage: 4 },
        { name: 'ポイズンミスト', damage: 2 },
        { name: 'ライフドレイン', damage: 2, heal: 1 },
        { name: 'ガーディアン', damage: 0, heal: 3 },
        { name: 'メテオ', damage: 5 },
        { name: '連撃', damage: 3 },
        { name: '再生', damage: 0, heal: 4 },
        { name: 'シャドウボルト', damage: 3 },
      ];

      const getPoolByDeckName = (name) => (name === '作成デッキ' ? CREATE_CARD_POOL : STANDARD_CARD_POOL);

      const drawRandomCards = (pool, count) => {
        const shuffled = [...pool].sort(() => Math.random() - 0.5);
        return shuffled.slice(0, Math.min(count, shuffled.length)).map((card) => ({ ...card }));
      };

      const setView = (view) => {
        [deckSelectView, battleStartView, battlePlayView, battleView, deckBuilderView].forEach((section) => {
          section.classList.add('hidden');
        });
        view.classList.remove('hidden');
      };

      const showBattleResult = (resultSummary) => {
        battleCount += 1;
        battleResult.textContent = `${battleCount}戦目: ${deckName} で${resultSummary}`;
        setView(battleView);
      };

      const openBattleStart = () => {
        battleStartMessage.textContent = `${deckName}で対戦を開始します。`;
        setView(battleStartView);
      };

      const startBattle = () => {
        const playerPool = getPoolByDeckName(deckName);
        const enemyPool = deckName === '作成デッキ' ? STANDARD_CARD_POOL : CREATE_CARD_POOL;
        battleState = {
          turn: 1,
          currentTurn: 'player',
          playerHp: 12,
          enemyHp: 12,
          playerHandCards: drawRandomCards(playerPool, 5),
          enemyHandCards: drawRandomCards(enemyPool, 5),
          playerBoardCards: [],
          enemyBoardCards: [],
          playerAwakenings: 2,
          enemyAwakenings: 2,
          selectedCardId: null,
          finished: false,
        };
        appendLog('対戦開始: あなたのターンです。');
        renderBattleState();
        setView(battlePlayView);
      };

      const appendLog = (message) => {
        battleState.logs = battleState.logs || [];
        battleState.logs.unshift(message);
        battleState.logs = battleState.logs.slice(0, 5);
      };

      const renderBattleState = () => {
        renderOpponentLeaderInfo();
        renderOpponentHand();
        renderBoard(opponentBoardArea, battleState.enemyBoardCards, false);
        renderCenterBattleInfo();
        renderBoard(playerBoardArea, battleState.playerBoardCards, true);
        renderPlayerHand();
        renderBattleControls();
      };

      const createBoardUnitFromCard = (card, index) => ({
        id: `${card.name}-${Date.now()}-${index}`,
        name: card.name,
        attack: Math.max(1, card.damage || 1),
        hp: Math.max(1, (card.heal || 0) + 2),
        guard: (card.heal || 0) > 0,
        awakened: (card.damage || 0) >= 4,
        canAttack: (card.damage || 0) > 0,
        status: (card.heal || 0) > 0 ? '強化' : '通常',
      });

      const renderOpponentLeaderInfo = () => {
        const enemyTurnBadge =
          battleState.currentTurn === 'enemy'
            ? '<span class="rounded-full bg-rose-100 px-2 py-1 text-xs font-bold text-rose-700">相手ターン</span>'
            : '<span class="rounded-full bg-slate-100 px-2 py-1 text-xs font-bold text-slate-600">待機中</span>';
        opponentLeaderInfo.innerHTML = `
          <div class="flex items-center justify-between">
            <p class="text-sm font-semibold text-slate-600">相手リーダー</p>
            ${enemyTurnBadge}
          </div>
          <div class="mt-1 grid grid-cols-3 gap-2 text-xs text-slate-700">
            <p class="rounded-lg bg-slate-100 px-2 py-1">HP: <strong>${battleState.enemyHp}</strong></p>
            <p class="rounded-lg bg-slate-100 px-2 py-1">山札: <strong>${battleState.enemyHandCards.length}</strong></p>
            <p class="rounded-lg bg-slate-100 px-2 py-1">覚醒: <strong>${battleState.enemyAwakenings}</strong></p>
          </div>
        `;
      };

      const renderOpponentHand = () => {
        const backs = Array.from({ length: battleState.enemyHandCards.length })
          .map(
            () =>
              '<div class="card-back h-12 w-8 shrink-0 rounded-md border border-slate-500/30 shadow-sm sm:h-14 sm:w-10"></div>',
          )
          .join('');
        opponentHandArea.innerHTML = `
          <div class="flex items-center justify-between text-xs text-slate-600">
            <p class="font-semibold">相手手札（裏向き）</p>
            <p>手札 ${battleState.enemyHandCards.length} 枚</p>
          </div>
          <div class="mt-2 flex items-center overflow-x-auto pr-1">
            <div class="-space-x-3">${backs || '<p class="text-xs text-slate-400">手札なし</p>'}</div>
          </div>
        `;
      };

      const renderBoard = (target, boardCards, isPlayer) => {
        const title = isPlayer ? '自分盤面' : '相手盤面';
        const cards = boardCards
          .slice(0, 5)
          .map(
            (card) => `
            <button type="button" class="${isPlayer ? 'cursor-pointer' : 'cursor-default'} ${
              isPlayer && battleState.selectedCardId === card.id ? 'ring-2 ring-emerald-500' : ''
            } flex h-20 min-w-0 flex-1 flex-col justify-between rounded-lg border border-slate-200 bg-white p-1 text-left shadow-sm" data-board-id="${card.id}">
              <p class="truncate text-[10px] font-semibold text-slate-700">${card.name}</p>
              <div class="flex items-center justify-between text-[10px]">
                <span class="rounded bg-rose-100 px-1 text-rose-700">ATK ${card.attack}</span>
                <span class="rounded bg-emerald-100 px-1 text-emerald-700">HP ${card.hp}</span>
              </div>
              <p class="truncate text-[9px] text-slate-500">${card.guard ? '守護' : '通常'} / ${card.awakened ? '覚醒済み' : card.status} / ${
              card.canAttack ? '攻撃可' : '待機'
            }</p>
            </button>`,
          )
          .join('');
        target.innerHTML = `
          <div class="flex items-center justify-between text-xs text-slate-600">
            <p class="font-semibold">${title}</p>
            <p>${boardCards.length}/5</p>
          </div>
          <div class="mt-2 flex gap-1">${cards || '<p class="text-xs text-slate-400">カードなし</p>'}</div>
        `;
        if (isPlayer) {
          target.querySelectorAll('[data-board-id]').forEach((button) => {
            button.addEventListener('click', () => {
              battleState.selectedCardId = button.dataset.boardId;
              status.textContent = '自分盤面カードを選択中です。';
              renderBattleState();
            });
          });
        }
      };

      const renderCenterBattleInfo = () => {
        const currentTurnLabel = battleState.currentTurn === 'player' ? 'あなた' : '相手';
        const logs = (battleState.logs || [])
          .map((message) => `<p class="truncate text-[11px] text-slate-600">・${message}</p>`)
          .join('');
        centerBattleInfo.innerHTML = `
          <div class="flex items-center justify-between text-xs">
            <p class="font-bold text-indigo-700">TURN ${battleState.turn}</p>
            <p class="rounded-full bg-indigo-200/70 px-2 py-1 font-semibold text-indigo-700">手番: ${currentTurnLabel}</p>
          </div>
          <p class="mt-1 text-center text-sm font-black tracking-widest text-indigo-400">VS</p>
          <p class="mt-1 text-[11px] text-slate-700">ガイド: 手札をタップして使用、またはターン終了でパスします。</p>
          <div class="mt-1 max-h-10 overflow-y-auto space-y-0.5">${logs || '<p class="text-[11px] text-slate-400">ログはここに表示されます。</p>'}</div>
        `;
      };

      const describeCardEffect = (card) => {
        const effects = [];
        if (card.damage > 0) {
          effects.push(`ダメージ ${card.damage}`);
        }
        if (card.heal > 0) {
          effects.push(`回復 ${card.heal}`);
        }
        return effects.join(' / ') || '効果なし';
      };

      const renderPlayerHand = () => {
        playerHandArea.innerHTML = '';

        if (battleState.playerHandCards.length === 0) {
          const message = document.createElement('p');
          message.className = 'empty-hand';
          message.textContent = '手札がありません。パスしてください。';
          playerHandArea.appendChild(message);
          return;
        }

        const wrapper = document.createElement('div');
        wrapper.className = 'h-full';
        wrapper.innerHTML = `
          <div class="mb-2 flex items-center justify-between text-xs text-slate-600">
            <p class="font-semibold">自分手札（表向き）</p>
            <p>手札 ${battleState.playerHandCards.length} 枚</p>
          </div>
          <div id="player-hand-scroll" class="flex gap-2 overflow-x-auto pb-1"></div>
        `;
        playerHandArea.appendChild(wrapper);
        const scroll = document.getElementById('player-hand-scroll');
        battleState.playerHandCards.forEach((card, index) => {
          const button = document.createElement('button');
          const playable = battleState.currentTurn === 'player';
          button.className = `w-28 shrink-0 rounded-xl border p-2 text-left shadow-sm ${
            playable ? 'border-indigo-200 bg-white text-slate-800' : 'border-slate-200 bg-slate-100 text-slate-400'
          }`;
          button.type = 'button';
          button.innerHTML = `
            <p class="truncate text-xs font-bold">${card.name}</p>
            <p class="mt-1 text-[11px]">コスト: ${Math.max(1, card.damage || card.heal || 1)}</p>
            <p class="text-[11px]">種別: ${(card.heal || 0) > 0 ? 'アミュレット' : 'ユニット'}</p>
            <p class="mt-1 line-clamp-2 text-[10px] text-slate-500">${describeCardEffect(card)}</p>
          `;
          button.addEventListener('click', () => {
            if (battleState.currentTurn !== 'player') {
              status.textContent = '相手ターン中はカードを使えません。';
              return;
            }
            status.textContent = `${card.name} を使用しました。`;
            progressTurn(index);
          });
          scroll.appendChild(button);
        });
      };

      const renderBattleControls = () => {
        battleControlsArea.innerHTML = `
          <div class="grid grid-cols-3 gap-2">
            <button class="rounded-lg bg-indigo-600 px-2 py-2 text-xs font-semibold text-white" id="pass-turn-button">ターン終了</button>
            <button class="rounded-lg bg-amber-500 px-2 py-2 text-xs font-semibold text-white" id="awaken-button">覚醒</button>
            <button class="rounded-lg bg-slate-200 px-2 py-2 text-xs font-semibold text-slate-700" id="cancel-button">キャンセル</button>
          </div>
          <p class="mt-1 text-[11px] text-slate-600">行動: ${
            battleState.selectedCardId ? 'カード選択中' : '手札からカードを選択してください'
          }</p>
        `;
        document.getElementById('pass-turn-button').addEventListener('click', () => {
          status.textContent = 'パスして相手のターンに移ります。';
          progressTurn();
        });
        document.getElementById('awaken-button').addEventListener('click', () => {
          if (battleState.playerAwakenings > 0) {
            battleState.playerAwakenings -= 1;
            status.textContent = '覚醒を使用しました。';
            appendLog('あなたが覚醒を使用しました。');
            renderBattleState();
          } else {
            status.textContent = '覚醒回数が残っていません。';
          }
        });
        document.getElementById('cancel-button').addEventListener('click', () => {
          battleState.selectedCardId = null;
          status.textContent = '選択中の行動をキャンセルしました。';
          renderBattleState();
        });
      };

      const finishBattleIfNeeded = () => {
        const noHand = battleState.playerHandCards.length <= 0 && battleState.enemyHandCards.length <= 0;
        const hpEnded = battleState.playerHp <= 0 || battleState.enemyHp <= 0;
        if (!noHand && !hpEnded) {
          return false;
        }

        battleState.finished = true;
        let resultSummary = '引き分けました。';
        if (battleState.playerHp > battleState.enemyHp) {
          resultSummary = '勝利しました！';
        } else if (battleState.playerHp < battleState.enemyHp) {
          resultSummary = '敗北しました。';
        }
        status.textContent = '対戦が終了しました。結果を表示します。';
        showBattleResult(resultSummary);
        return true;
      };

      const enemyTurn = () => {
        battleState.currentTurn = 'enemy';
        if (battleState.enemyHandCards.length > 0 && Math.random() > 0.3) {
          const cardIndex = Math.floor(Math.random() * battleState.enemyHandCards.length);
          const card = battleState.enemyHandCards.splice(cardIndex, 1)[0];
          if (card.damage > 0) {
            battleState.playerHp -= card.damage;
          }
          if (card.heal > 0) {
            battleState.enemyHp += card.heal;
          }
          battleState.enemyBoardCards.unshift(createBoardUnitFromCard(card, cardIndex));
          battleState.enemyBoardCards = battleState.enemyBoardCards.slice(0, 5);
          appendLog(`相手が「${card.name}」を使用（${describeCardEffect(card)}）。`);
        } else {
          appendLog('相手はパスしました。');
        }
      };

      const progressTurn = (playerCardIndex) => {
        if (!battleState || battleState.finished) {
          return;
        }

        if (typeof playerCardIndex === 'number') {
          const card = battleState.playerHandCards.splice(playerCardIndex, 1)[0];
          if (!card) {
            appendLog('選択したカードが見つかりませんでした。');
          } else {
            if (card.damage > 0) {
              battleState.enemyHp -= card.damage;
            }
            if (card.heal > 0) {
              battleState.playerHp += card.heal;
            }
            battleState.playerBoardCards.unshift(createBoardUnitFromCard(card, playerCardIndex));
            battleState.playerBoardCards = battleState.playerBoardCards.slice(0, 5);
            appendLog(`あなたが「${card.name}」を使用（${describeCardEffect(card)}）。`);
          }
        } else {
          appendLog('あなたはパスしました。');
        }

        if (finishBattleIfNeeded()) {
          return;
        }

        enemyTurn();

        if (finishBattleIfNeeded()) {
          return;
        }

        battleState.turn += 1;
        battleState.currentTurn = 'player';
        renderBattleState();
      };

      document.querySelectorAll('#deck-select-view .option').forEach((button) => {
        button.addEventListener('click', () => {
          const mode = button.dataset.mode;
          deckName = mode === 'standard' ? 'スタンダードデッキ' : '作成デッキ';
          status.textContent =
            mode === 'standard'
              ? 'スタンダードデッキを選択しました。対戦開始画面へ進みます。'
              : 'デッキ作成を開始します。';

          if (mode === 'create') {
            setView(deckBuilderView);
            return;
          }

          openBattleStart();
        });
      });

      document.getElementById('edit-deck-button').addEventListener('click', () => {
        status.textContent = 'デッキを調整中です。';
        setView(deckBuilderView);
      });

      document.getElementById('start-after-build').addEventListener('click', () => {
        deckName = '作成デッキ';
        status.textContent = '作成デッキで対戦開始画面へ進みます。';
        openBattleStart();
      });

      document.getElementById('rematch-button').addEventListener('click', () => {
        status.textContent = `${deckName}で再戦するため、対戦開始画面へ進みます。`;
        openBattleStart();
      });

      document.getElementById('begin-battle-button').addEventListener('click', () => {
        status.textContent = `${deckName}で対戦を開始しました。`;
        startBattle();
      });

    </script>
  </body>
</html>
