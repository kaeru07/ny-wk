<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>デッキ対戦ループ</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f7f8ff 0%, #edf2ff 100%);
      }

      .panel {
        width: min(560px, calc(100% - 2rem));
        background: #fff;
        color: #1f2937;
        border-radius: 16px;
        padding: 1.5rem;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin-top: 0;
        font-size: 1.4rem;
      }

      .hidden {
        display: none;
      }

      .options {
        display: grid;
        gap: 0.75rem;
      }

      .option {
        border: 1px solid #dbe2ff;
        border-radius: 12px;
        padding: 1rem;
        text-align: left;
        background: #f8faff;
        cursor: pointer;
      }

      .option:hover {
        border-color: #8fa6ff;
        background: #eef2ff;
      }

      .option-title {
        font-weight: 700;
        margin: 0 0 0.25rem;
      }

      .option-desc {
        margin: 0;
        font-size: 0.9rem;
        color: #4b5563;
      }

      #status {
        margin-top: 1rem;
        font-weight: 600;
        color: #1d4ed8;
      }

      .flow-note {
        margin: 0.25rem 0 0;
        font-size: 0.9rem;
        color: #4b5563;
      }

      .battle-card {
        margin-top: 1rem;
        padding: 1rem;
        border-radius: 12px;
        background: #f8faff;
        border: 1px solid #dbe2ff;
      }

      .battle-result {
        margin: 0;
        font-size: 1rem;
      }

      .actions {
        margin-top: 1rem;
        display: flex;
        gap: 0.75rem;
      }

      .actions .option {
        flex: 1;
      }

      .battle-state {
        margin-top: 0.75rem;
        padding: 0.75rem;
        border-radius: 10px;
        background: #ffffff;
        border: 1px solid #dbe2ff;
        font-size: 0.95rem;
      }

      .battle-state p {
        margin: 0.2rem 0;
      }

      .battle-log {
        margin-top: 0.75rem;
        max-height: 160px;
        overflow-y: auto;
        padding: 0.75rem;
        border-radius: 10px;
        border: 1px solid #dbe2ff;
        background: #ffffff;
      }

      .battle-log p {
        margin: 0 0 0.35rem;
        font-size: 0.9rem;
      }

      .hand-cards {
        margin-top: 1rem;
        display: grid;
        gap: 0.6rem;
      }

      .hand-card-button {
        border: 1px solid #dbe2ff;
        border-radius: 10px;
        padding: 0.75rem;
        background: #ffffff;
        text-align: left;
        cursor: pointer;
      }

      .hand-card-button:hover {
        border-color: #8fa6ff;
        background: #eef2ff;
      }

      .hand-card-title {
        margin: 0;
        font-weight: 700;
      }

      .hand-card-effect {
        margin: 0.2rem 0 0;
        font-size: 0.9rem;
        color: #4b5563;
      }

      .empty-hand {
        margin: 0;
        font-size: 0.9rem;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <section id="deck-select-view">
        <h1>最初に使うデッキを選んでください</h1>
        <div class="options">
          <button class="option" data-mode="standard">
            <p class="option-title">スタンダードデッキを使う</p>
            <p class="option-desc">すぐにプレイできる標準構成を選択します。</p>
          </button>

          <button class="option" data-mode="create">
            <p class="option-title">デッキを作成する</p>
            <p class="option-desc">カードを選びながら自分用にデッキを作成します。</p>
          </button>
        </div>
      </section>

      <section id="battle-play-view" class="hidden">
        <h1>対戦中</h1>
        <p>手札のカードをクリックして使うか、パスを選択してください。</p>
        <div class="battle-state">
          <p id="turn-indicator"></p>
          <p id="player-hp"></p>
          <p id="enemy-hp"></p>
          <p id="player-hand"></p>
          <p id="enemy-hand"></p>
        </div>
        <div id="player-hand-cards" class="hand-cards"></div>
        <div class="actions">
          <button class="option" id="pass-turn-button">
            <p class="option-title">パス</p>
            <p class="option-desc">このターンは何もせず相手の行動に移ります。</p>
          </button>
        </div>
        <div class="battle-log" id="battle-log" aria-live="polite"></div>
      </section>

      <section id="battle-start-view" class="hidden">
        <h1>対戦開始</h1>
        <p id="battle-start-message"></p>
        <p class="flow-note">準備ができたら、下のボタンで対戦を開始してください。</p>
        <button class="option" id="begin-battle-button">
          <p class="option-title">このデッキで対戦開始</p>
          <p class="option-desc">マッチングして対戦に入ります。</p>
        </button>
      </section>

      <section id="battle-view" class="hidden">
        <h1>対戦終了</h1>
        <div class="battle-card">
          <p class="battle-result" id="battle-result"></p>
          <div class="actions">
            <button class="option" id="edit-deck-button">
              <p class="option-title">デッキを作成する</p>
              <p class="option-desc">デッキを調整して次の対戦に挑みます。</p>
            </button>
            <button class="option" id="rematch-button">
              <p class="option-title">そのまま再戦</p>
              <p class="option-desc">同じデッキで続けてもう1戦します。</p>
            </button>
          </div>
        </div>
      </section>

      <section id="deck-builder-view" class="hidden">
        <h1>デッキ作成</h1>
        <p>カードを調整しました。次の対戦に進みますか？</p>
        <button class="option" id="start-after-build">
          <p class="option-title">このデッキで対戦する</p>
          <p class="option-desc">作成したデッキで対戦に戻ります。</p>
        </button>
      </section>

      <section>
        <p id="status" aria-live="polite"></p>
      </section>
    </main>

    <script>
      const deckSelectView = document.getElementById('deck-select-view');
      const battlePlayView = document.getElementById('battle-play-view');
      const battleStartView = document.getElementById('battle-start-view');
      const battleView = document.getElementById('battle-view');
      const deckBuilderView = document.getElementById('deck-builder-view');
      const battleStartMessage = document.getElementById('battle-start-message');
      const battleResult = document.getElementById('battle-result');
      const status = document.getElementById('status');
      const turnIndicator = document.getElementById('turn-indicator');
      const playerHpLabel = document.getElementById('player-hp');
      const enemyHpLabel = document.getElementById('enemy-hp');
      const playerHandLabel = document.getElementById('player-hand');
      const enemyHandLabel = document.getElementById('enemy-hand');
      const playerHandCards = document.getElementById('player-hand-cards');
      const battleLog = document.getElementById('battle-log');
      const passTurnButton = document.getElementById('pass-turn-button');

      let deckName = 'スタンダードデッキ';
      let battleCount = 0;
      let battleState = null;

      const STANDARD_CARD_POOL = [
        { name: 'ファイアボール', damage: 3 },
        { name: 'アイスランス', damage: 2 },
        { name: 'サンダーストライク', damage: 4 },
        { name: 'シールド', damage: 0, heal: 2 },
        { name: 'スラッシュ', damage: 2 },
        { name: 'ヒールライト', damage: 0, heal: 3 },
        { name: 'アローショット', damage: 1 },
        { name: 'ブレイズ', damage: 3 },
      ];

      const CREATE_CARD_POOL = [
        { name: 'ダブルスラッシュ', damage: 4 },
        { name: 'ポイズンミスト', damage: 2 },
        { name: 'ライフドレイン', damage: 2, heal: 1 },
        { name: 'ガーディアン', damage: 0, heal: 3 },
        { name: 'メテオ', damage: 5 },
        { name: '連撃', damage: 3 },
        { name: '再生', damage: 0, heal: 4 },
        { name: 'シャドウボルト', damage: 3 },
      ];

      const getPoolByDeckName = (name) => (name === '作成デッキ' ? CREATE_CARD_POOL : STANDARD_CARD_POOL);

      const drawRandomCards = (pool, count) => {
        const shuffled = [...pool].sort(() => Math.random() - 0.5);
        return shuffled.slice(0, Math.min(count, shuffled.length)).map((card) => ({ ...card }));
      };

      const setView = (view) => {
        [deckSelectView, battleStartView, battlePlayView, battleView, deckBuilderView].forEach((section) => {
          section.classList.add('hidden');
        });
        view.classList.remove('hidden');
      };

      const showBattleResult = (resultSummary) => {
        battleCount += 1;
        battleResult.textContent = `${battleCount}戦目: ${deckName} で${resultSummary}`;
        setView(battleView);
      };

      const openBattleStart = () => {
        battleStartMessage.textContent = `${deckName}で対戦を開始します。`;
        setView(battleStartView);
      };

      const startBattle = () => {
        const playerPool = getPoolByDeckName(deckName);
        const enemyPool = deckName === '作成デッキ' ? STANDARD_CARD_POOL : CREATE_CARD_POOL;
        battleState = {
          turn: 1,
          playerHp: 12,
          enemyHp: 12,
          playerHandCards: drawRandomCards(playerPool, 5),
          enemyHandCards: drawRandomCards(enemyPool, 5),
          finished: false,
        };
        battleLog.innerHTML = '';
        appendLog('対戦開始: あなたのターンです。');
        renderBattleState();
        setView(battlePlayView);
      };

      const appendLog = (message) => {
        const row = document.createElement('p');
        row.textContent = `・${message}`;
        battleLog.prepend(row);
      };

      const renderBattleState = () => {
        turnIndicator.textContent = `ターン: ${battleState.turn}`;
        playerHpLabel.textContent = `あなたのライフ: ${battleState.playerHp}`;
        enemyHpLabel.textContent = `相手のライフ: ${battleState.enemyHp}`;
        playerHandLabel.textContent = `あなたの手札: ${battleState.playerHandCards.length}`;
        enemyHandLabel.textContent = `相手の手札: ${battleState.enemyHandCards.length}`;
        renderPlayerHand();
      };

      const describeCardEffect = (card) => {
        const effects = [];
        if (card.damage > 0) {
          effects.push(`ダメージ ${card.damage}`);
        }
        if (card.heal > 0) {
          effects.push(`回復 ${card.heal}`);
        }
        return effects.join(' / ') || '効果なし';
      };

      const renderPlayerHand = () => {
        playerHandCards.innerHTML = '';

        if (battleState.playerHandCards.length === 0) {
          const message = document.createElement('p');
          message.className = 'empty-hand';
          message.textContent = '手札がありません。パスしてください。';
          playerHandCards.appendChild(message);
          return;
        }

        battleState.playerHandCards.forEach((card, index) => {
          const button = document.createElement('button');
          button.className = 'hand-card-button';
          button.type = 'button';
          button.innerHTML = `
            <p class="hand-card-title">${card.name}</p>
            <p class="hand-card-effect">${describeCardEffect(card)}</p>
          `;
          button.addEventListener('click', () => {
            status.textContent = `${card.name} を使用しました。`;
            progressTurn(index);
          });
          playerHandCards.appendChild(button);
        });
      };

      const finishBattleIfNeeded = () => {
        const noHand = battleState.playerHandCards.length <= 0 && battleState.enemyHandCards.length <= 0;
        const hpEnded = battleState.playerHp <= 0 || battleState.enemyHp <= 0;
        if (!noHand && !hpEnded) {
          return false;
        }

        battleState.finished = true;
        let resultSummary = '引き分けました。';
        if (battleState.playerHp > battleState.enemyHp) {
          resultSummary = '勝利しました！';
        } else if (battleState.playerHp < battleState.enemyHp) {
          resultSummary = '敗北しました。';
        }
        status.textContent = '対戦が終了しました。結果を表示します。';
        showBattleResult(resultSummary);
        return true;
      };

      const enemyTurn = () => {
        if (battleState.enemyHandCards.length > 0 && Math.random() > 0.3) {
          const cardIndex = Math.floor(Math.random() * battleState.enemyHandCards.length);
          const card = battleState.enemyHandCards.splice(cardIndex, 1)[0];
          if (card.damage > 0) {
            battleState.playerHp -= card.damage;
          }
          if (card.heal > 0) {
            battleState.enemyHp += card.heal;
          }
          appendLog(`相手が「${card.name}」を使用（${describeCardEffect(card)}）。`);
        } else {
          appendLog('相手はパスしました。');
        }
      };

      const progressTurn = (playerCardIndex) => {
        if (!battleState || battleState.finished) {
          return;
        }

        if (typeof playerCardIndex === 'number') {
          const card = battleState.playerHandCards.splice(playerCardIndex, 1)[0];
          if (!card) {
            appendLog('選択したカードが見つかりませんでした。');
          } else {
            if (card.damage > 0) {
              battleState.enemyHp -= card.damage;
            }
            if (card.heal > 0) {
              battleState.playerHp += card.heal;
            }
            appendLog(`あなたが「${card.name}」を使用（${describeCardEffect(card)}）。`);
          }
        } else {
          appendLog('あなたはパスしました。');
        }

        if (finishBattleIfNeeded()) {
          return;
        }

        enemyTurn();

        if (finishBattleIfNeeded()) {
          return;
        }

        battleState.turn += 1;
        renderBattleState();
      };

      document.querySelectorAll('#deck-select-view .option').forEach((button) => {
        button.addEventListener('click', () => {
          const mode = button.dataset.mode;
          deckName = mode === 'standard' ? 'スタンダードデッキ' : '作成デッキ';
          status.textContent =
            mode === 'standard'
              ? 'スタンダードデッキを選択しました。対戦開始画面へ進みます。'
              : 'デッキ作成を開始します。';

          if (mode === 'create') {
            setView(deckBuilderView);
            return;
          }

          openBattleStart();
        });
      });

      document.getElementById('edit-deck-button').addEventListener('click', () => {
        status.textContent = 'デッキを調整中です。';
        setView(deckBuilderView);
      });

      document.getElementById('start-after-build').addEventListener('click', () => {
        deckName = '作成デッキ';
        status.textContent = '作成デッキで対戦開始画面へ進みます。';
        openBattleStart();
      });

      document.getElementById('rematch-button').addEventListener('click', () => {
        status.textContent = `${deckName}で再戦するため、対戦開始画面へ進みます。`;
        openBattleStart();
      });

      document.getElementById('begin-battle-button').addEventListener('click', () => {
        status.textContent = `${deckName}で対戦を開始しました。`;
        startBattle();
      });

      passTurnButton.addEventListener('click', () => {
        status.textContent = 'パスして相手のターンに移ります。';
        progressTurn();
      });
    </script>
  </body>
</html>
