<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>デッキ選択</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f7f8ff 0%, #edf2ff 100%);
      }

      .panel {
        width: min(560px, calc(100% - 2rem));
        background: #fff;
        color: #1f2937;
        border-radius: 16px;
        padding: 1.5rem;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin-top: 0;
        font-size: 1.4rem;
      }

      .options {
        display: grid;
        gap: 0.75rem;
      }

      .option {
        border: 1px solid #dbe2ff;
        border-radius: 12px;
        padding: 1rem;
        text-align: left;
        background: #f8faff;
        cursor: pointer;
      }

      .option:hover {
        border-color: #8fa6ff;
        background: #eef2ff;
      }

      .option-title {
        font-weight: 700;
        margin: 0 0 0.25rem;
      }

      .option-desc {
        margin: 0;
        font-size: 0.9rem;
        color: #4b5563;
      }

      #status {
        margin-top: 1rem;
        font-weight: 600;
        color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1>最初に使うデッキを選んでください</h1>
      <div class="options">
        <button class="option" data-mode="standard">
          <p class="option-title">スタンダードデッキを使う</p>
          <p class="option-desc">すぐにプレイできる標準構成を選択します。</p>
        </button>

        <button class="option" data-mode="create">
          <p class="option-title">デッキを作成する</p>
          <p class="option-desc">カードを選びながら自分用にデッキを作成します。</p>
        </button>
      </div>
      <p id="status" aria-live="polite"></p>
    </main>

    <script>
      const status = document.getElementById('status');
      document.querySelectorAll('.option').forEach((button) => {
        button.addEventListener('click', () => {
          const mode = button.dataset.mode;
          status.textContent =
            mode === 'standard'
              ? 'スタンダードデッキを選択しました。'
              : 'デッキ作成を開始します。';
        });
      });
    </script>
  </body>
</html>
